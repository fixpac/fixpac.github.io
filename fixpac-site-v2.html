<title>FIXPAC 官网原型</title>
<style>
:root{
  --navy:#0B2A4A; --navy-2:#123A63; --teal:#00A99D; --teal-dark:#00857C; --teal-soft:#E5F6F4;
  --ink:#1C2B3A; --muted:#5B6B7B; --line:#DFE7ED; --bg:#FFFFFF; --bg-soft:#F4F8FA; --bg-band:#EDF3F7;
  --warn-bg:#FFF7E8; --warn-line:#F0D9A8; --warn-ink:#7A5A14;
  --radius:14px; --shadow:0 10px 30px rgba(11,42,74,.10);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{color:var(--navy);line-height:1.3;margin:0}
.section{padding:56px 0}
.section.soft{background:var(--bg-soft)}
.sec-head{margin-bottom:28px;max-width:720px}
.sec-head h2{font-size:clamp(24px,3.4vw,32px);margin-bottom:8px}
.sec-head p{color:var(--muted);margin:0}
.tag-flag{display:inline-block;background:var(--teal);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;vertical-align:middle;margin-left:8px;letter-spacing:.04em}

/* ---------- header ---------- */
.site-header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;gap:20px;height:66px}
.logo-link{display:flex;align-items:center;flex:none}
.logo-link img{height:38px;width:auto}
.main-nav{display:flex;gap:4px;margin-left:auto}
.nav-item{position:relative}
.nav-link{display:inline-flex;align-items:center;gap:4px;padding:10px 13px;font-weight:600;color:var(--navy);border-radius:8px;font-size:15px;background:none;border:0}
.nav-link:hover,.nav-link.active{background:var(--teal-soft);color:var(--teal-dark)}
.nav-link .chev{transition:transform .2s}
.nav-item.open .nav-link .chev{transform:rotate(180deg)}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:none}
.nav-item.open .dropdown{display:block}
.dropdown a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;font-size:14.5px;color:var(--ink)}
.dropdown a:hover{background:var(--bg-soft)}
.dropdown a small{color:var(--muted);font-size:12px}
.dropdown .dd-group{font-size:12px;color:var(--muted);padding:8px 12px 2px;font-weight:700;letter-spacing:.05em}
.header-cta{flex:none;margin-left:8px}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:42px;align-items:center;justify-content:center;color:var(--navy)}
.mobile-menu{display:none;border-top:1px solid var(--line);background:#fff;padding:10px 20px 18px;max-height:calc(100vh - 66px);overflow:auto}
.mobile-menu.open{display:block}
.mobile-menu a.mm-link{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--bg-band);font-weight:600;color:var(--navy)}
.mobile-menu .mm-sub{padding:2px 0 8px 14px}
.mobile-menu .mm-sub a{display:block;padding:7px 0;color:var(--ink);font-size:15px}
.mobile-menu .mm-group{font-size:12.5px;color:var(--muted);font-weight:700;padding:12px 0 2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 22px;font-weight:700;font-size:15.5px;border:1.5px solid transparent;transition:transform .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-dark)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-ghost{background:#fff;border-color:var(--navy);color:var(--navy)}
.btn-ghost:hover{background:var(--bg-soft)}
.btn-sm{padding:9px 16px;font-size:14px;border-radius:9px}
.btn-block{width:100%}

/* ---------- hero / page head ---------- */
.hero{background:linear-gradient(180deg,#EAF3F7 0%,#F7FAFB 78%);border-bottom:1px solid var(--line);overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding:52px 0 46px}
.hero h1{font-size:clamp(32px,5.2vw,50px);font-weight:800;letter-spacing:.01em}
.hero .sub{font-size:clamp(16px,2.2vw,19px);color:var(--ink);margin:18px 0 6px;font-weight:600}
.hero .sub2{color:var(--muted);margin:0 0 26px}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-img{border-radius:18px;box-shadow:var(--shadow)}
.page-head{background:var(--bg-soft);border-bottom:1px solid var(--line);padding:30px 0 34px}
.page-head h1{font-size:clamp(26px,4vw,38px);margin:6px 0 10px}
.page-head .lead{color:var(--muted);max-width:760px;margin:0}
.page-head .head-btns{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.crumbs{font-size:13.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a:hover{color:var(--teal-dark)}
.crumbs .sep{opacity:.5}

/* ---------- cards & grids ---------- */
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;gap:8px}
a.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card h3{font-size:18px}
.card p{color:var(--muted);margin:0;font-size:14.5px}
.card .go{margin-top:auto;color:var(--teal-dark);font-weight:700;font-size:14.5px;display:inline-flex;gap:6px;align-items:center;padding-top:6px}
.icon-badge{width:46px;height:46px;border-radius:12px;background:var(--teal-soft);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex:none}
.icon-badge.navy{background:#E8EFF5;color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;background:var(--bg-band);color:var(--navy);border-radius:999px;padding:2px 10px;font-weight:600}
.chip.teal{background:var(--teal-soft);color:var(--teal-dark)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.combo-strip{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px 22px;font-weight:700;transition:background .15s,transform .15s}
.combo-strip:hover{background:var(--navy-2);transform:translateY(-2px)}
.combo-strip .combo-label{color:#9EDCD6;font-size:13px;font-weight:800;letter-spacing:.05em;display:block;margin-bottom:2px}
.combo-strip .combo-items{font-size:16.5px;line-height:1.5}
.combo-strip .combo-go{flex:none;color:#fff;font-weight:800;white-space:nowrap}
.product-count{color:var(--muted);font-size:14px;margin:0 0 16px}

/* problem cards */
.problem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.problem-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;gap:12px;align-items:flex-start;transition:transform .18s,box-shadow .18s;text-align:left;width:100%}
.problem-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.problem-card h3{font-size:16.5px}
.problem-card p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* process cards */
.process-card.featured{border:2px solid var(--teal);position:relative}
.process-card .p-name{font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.process-card dl{margin:6px 0 0;display:grid;gap:4px;font-size:14px}
.process-card dt{color:var(--muted);font-weight:600;float:left;margin-right:8px}
.process-card dd{margin:0;color:var(--ink)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;counter-reset:step}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative}
.step .num{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.step h3{font-size:16px;margin-bottom:4px}
.step p{margin:0;color:var(--muted);font-size:14px}
.principle-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* image placeholder */
.ph{border:1.5px dashed #B9CBD8;border-radius:var(--radius);background:repeating-linear-gradient(45deg,#F2F7FA 0 14px,#EAF2F7 14px 28px);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:26px 18px;min-height:190px}
.ph strong{color:var(--navy);font-size:15px}
.ph span{font-size:13px}
.ph.video{min-height:230px}

/* tables */
table.spec{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:15px}
table.spec th,table.spec td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--bg-band);vertical-align:top}
table.spec th{background:var(--bg-soft);color:var(--navy);width:34%;font-weight:700}
table.spec tr:last-child th,table.spec tr:last-child td{border-bottom:0}
.tbd{color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:0 8px;font-size:13.5px;font-weight:700;white-space:nowrap}
table.compare{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:15px;border-radius:var(--radius);overflow:hidden}
table.compare th,table.compare td{padding:12px 16px;border-bottom:1px solid var(--bg-band);text-align:left;vertical-align:top}
table.compare thead th{background:var(--navy);color:#fff}
table.compare tbody th{background:var(--bg-soft);color:var(--navy);width:24%}
.table-scroll{overflow-x:auto;border-radius:var(--radius)}
.note{font-size:13.5px;color:var(--muted);margin-top:10px}

/* FAQ */
details.faq{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.faq summary{cursor:pointer;padding:16px 20px;font-weight:700;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .chev{transition:transform .2s;flex:none;color:var(--teal-dark)}
details.faq[open ] summary .chev{transform:rotate(180deg)}
details.faq .faq-body{padding:0 20px 18px;color:var(--muted)}

/* article body */
.article-body{max-width:820px}
.article-body h2{font-size:22px;margin:30px 0 10px}
.article-body h2:first-child{margin-top:0}
.article-body p{color:#33475C;margin:0 0 12px}
.article-body ul{margin:0 0 14px;padding-left:22px;color:#33475C}
.article-body li{margin-bottom:6px}
.cause-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:6px 0 8px}
.cause-box{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.cause-box h3{font-size:16px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.cause-box ul{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.meta-row .date{color:var(--muted);font-size:13.5px}

/* filters */
.filter-bar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:22px;display:grid;gap:14px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-row .f-label{font-weight:700;color:var(--navy);font-size:14px;width:76px;flex:none}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 15px;font-size:14px;color:var(--ink)}
.fbtn:hover{border-color:var(--teal)}
.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.search-row input[type=search]{flex:1;min-width:200px}
.empty-state{border:1.5px dashed var(--line);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--muted)}

/* forms */
input[type=text],input[type=tel],input[type=email],textarea,select{font-family:inherit;font-size:15.5px;padding:11px 13px;border:1px solid #C4D2DD;border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-field{display:grid;gap:6px}
.f-field.full{grid-column:1/-1}
.f-field label{font-weight:700;color:var(--navy);font-size:14.5px}
.f-field label .req{color:#C0392B}
.f-field .hint{font-size:13px;color:var(--muted)}
.check-group{display:flex;flex-wrap:wrap;gap:8px}
.check-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #C4D2DD;border-radius:999px;padding:7px 16px 7px 12px;font-size:14.5px;background:#fff;cursor:pointer;color:var(--ink)}
.check-pill input{appearance:none;-webkit-appearance:none;width:17px;height:17px;flex:none;margin:0;padding:0;border:1.5px solid #9FB4C4;border-radius:5px;background:#fff;display:grid;place-content:center;cursor:pointer}
.check-pill input[type=radio]{border-radius:50%}
.check-pill input:checked{background:var(--navy);border-color:var(--navy)}
.check-pill input[type=checkbox]:checked::after{content:"";width:10px;height:10px;background:#fff;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%)}
.check-pill input[type=radio]:checked::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.check-pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.check-pill input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.radio-group{display:flex;flex-wrap:wrap;gap:8px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.form-error{background:#FDECEA;border:1px solid #F2B8B2;color:#8C2B21;border-radius:10px;padding:12px 16px;font-size:14.5px;display:none}
.form-error.show{display:block}
.form-success{background:var(--teal-soft);border:1px solid #A9DED9;border-radius:12px;padding:22px;text-align:center}
.form-success h3{margin-bottom:6px}
.form-success p{color:#33555A;margin:0 0 14px}

/* CTA band */
.cta-band{background:var(--navy);color:#fff;border-radius:18px;padding:34px 30px;display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{color:#fff;font-size:clamp(21px,3vw,27px)}
.cta-band p{color:#C9D8E6;margin:6px 0 0}
.cta-band .btns{display:flex;gap:10px;flex-wrap:wrap}

/* footer */
.site-footer{background:var(--navy);color:#C9D8E6;margin-top:0}
.footer-in{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:28px;padding:44px 0 30px}
.site-footer h4{color:#fff;margin:0 0 12px;font-size:15.5px}
.site-footer a{display:block;padding:4px 0;font-size:14.5px}
.site-footer a:hover{color:#fff}
.footer-logo{height:40px;width:auto;margin-bottom:12px;background:#fff;border-radius:8px;padding:4px 8px}
.footer-bottom{border-top:1px solid rgba(255,255,255,.16);padding:16px 0 22px;font-size:13px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.qr-box{width:118px;height:118px;border:1.5px dashed rgba(255,255,255,.55);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;color:#E7F0F7;padding:10px;background:rgba(255,255,255,.06)}
.qr-box.light{border-color:#B9CBD8;color:var(--muted);background:var(--bg-soft)}
.qr-box.big{width:190px;height:190px;font-size:14px;margin:0 auto}
.qr-real{display:block;background:#fff;border-radius:12px;padding:6px;object-fit:contain}
.qr-real.sm{width:118px;height:118px}
.qr-real.float{width:132px;height:132px;margin:0 auto 10px}
.qr-real.big{width:190px;height:190px;margin:0 auto}
.qr-real.success{width:160px;height:160px;margin:0 auto 14px;padding:6px;border:1px solid #A9DED9}

/* wechat float (desktop) */
.wx-float{position:fixed;right:18px;top:38%;z-index:55;width:172px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;text-align:center}
.wx-float .qr-box{margin:0 auto 10px;width:132px;height:132px}
.wx-float p{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.wx-float .wx-id{font-weight:800;color:var(--navy);font-size:16px;letter-spacing:.03em}
.wx-float .collapse-btn{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:16px;line-height:1;padding:4px}
.wx-float-mini{position:fixed;right:18px;top:38%;z-index:55;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 10px;font-weight:700;writing-mode:vertical-rl;letter-spacing:.2em;box-shadow:var(--shadow);display:none}

/* mobile bottom bar */
.mobile-bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:58;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:10px}
.mobile-bar .btn{flex:1}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,42,74,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:400px;width:100%;padding:28px 24px;text-align:center;position:relative;max-height:88vh;overflow:auto}
.modal h3{font-size:20px;margin-bottom:6px}
.modal p{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.modal .close-x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:22px;color:var(--muted);padding:6px;line-height:1}
.wx-id-row{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg-soft);border-radius:10px;padding:10px 14px;margin:14px 0}
.wx-id-row .id{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:.04em}

/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:999px;font-size:14.5px;z-index:95;opacity:0;pointer-events:none;transition:all .25s;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* quiz */
.quiz{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.quiz .q-step-label{font-size:13px;font-weight:700;color:var(--teal-dark);letter-spacing:.06em;margin-bottom:6px}
.quiz h3{font-size:20px;margin-bottom:16px}
.quiz-opts{display:flex;flex-wrap:wrap;gap:10px}
.quiz-opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 20px;font-size:15.5px;font-weight:600;color:var(--navy)}
.quiz-opt:hover{border-color:var(--teal)}
.quiz-opt.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}
.quiz-progress{display:flex;gap:6px}
.quiz-progress i{width:30px;height:5px;border-radius:99px;background:var(--bg-band);display:block}
.quiz-progress i.on{background:var(--teal)}
.quiz-result{border:1.5px solid var(--teal);background:var(--teal-soft);border-radius:14px;padding:22px}
.quiz-result h3{margin-bottom:8px}
.quiz-result p{color:#33555A;margin:0 0 10px}

/* misc */
.list-clean{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list-clean li{display:flex;gap:10px;align-items:flex-start;color:#33475C}
.list-clean .tick{color:var(--teal-dark);flex:none;margin-top:2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.lead-navy{font-size:17px;color:var(--navy);font-weight:600}
.divider{height:1px;background:var(--line);margin:8px 0}
.kv{display:grid;gap:4px;font-size:15px}
.kv b{color:var(--navy)}
.prev-next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}
.prev-next a{border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700;color:var(--navy);background:#fff}
.prev-next a:hover{border-color:var(--teal)}
.prev-next a.disabled{opacity:.4;pointer-events:none}
.mt{margin-top:22px}.mb{margin-bottom:22px}
body.has-mobile-bar{padding-bottom:0}

@media (max-width:1020px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .problem-grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(3,1fr)}
  .principle-steps{grid-template-columns:repeat(2,1fr)}
  .footer-in{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .main-nav,.header-cta{display:none}
  .burger{display:flex}
  .hero-in{grid-template-columns:1fr;padding:38px 0 34px}
  .wx-float,.wx-float-mini{display:none !important}
  .mobile-bar{display:flex}
  body{padding-bottom:74px}
  .grid-3{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .cause-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .section{padding:42px 0}
  .cta-band{padding:26px 20px}
}
@media (max-width:560px){
  .grid-2,.grid-4{grid-template-columns:1fr}
  .problem-grid{grid-template-columns:1fr 1fr;gap:10px}
  .problem-card{padding:14px}
  .steps{grid-template-columns:1fr 1fr}
  .principle-steps{grid-template-columns:1fr}
  .footer-in{grid-template-columns:1fr 1fr;gap:20px}
  .hero-btns .btn{flex:1}
  .quiz{padding:20px}
  .filter-row .f-label{width:100%}
  .combo-strip{flex-direction:column;align-items:flex-start;padding:16px 18px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}

var QUIZ = [
  {label:"第 1 步 / 共 3 步", q:"你主要包装什么产品？", key:"product", opts:["冷鲜猪肉","牛羊肉","禽肉","熟食及预制菜","海鲜","其他产品"]},

  {label:"第 3 步 / 共 3 步", q:"产量规模大概是？", key:"scale", opts:["试产 / 小批量","中等规模","大批量连续生产","还不确定"]}
];
function quizResult(){
  var prod=quizState.product, prob=quizState.problem, scale=quizState.scale;
  var proc, reason, next;
  if(prod==="海鲜" || prob==="陈列效果差"){
    proc=PROCESSES.vsp; reason="你的产品更看重陈列和锁鲜：贴体包装让膜像第二层皮肤贴紧产品，渗液少、卖相干净，海鲜和高端分割肉尤其合适。";
    next="先确认产品形态和托盒/底膜的搭配，再小批量打样看陈列效果。";
  } else if(scale==="大批量连续生产" && (prod==="熟食及预制菜")){
    proc=PROCESSES.thermo; reason="大批量、规格统一的产品，拉伸膜包装用卷膜在线成型、充填、封合，连续生产效率高，单盒成本更容易控住。";
    next="先把产品规格和每小时产量理清，再匹配成型模具和膜材规格。";
  } else if(prob==="货架期不够" && prod==="其他产品"){
    proc=PROCESSES.vacuum; reason="以延长货架期和长距离运输为先时，真空包装是稳妥的基础方案，还可以配合热收缩改善外观。";
    next="先确认产品形态适合抽真空（带尖刺、易碎的产品要另行评估），再选袋型和规格。";
  } else {
    proc=PROCESSES.map; reason="冷鲜零售场景里，气调包装在保色、货架期和陈列之间比较均衡，也是多数肉类、禽肉和熟食工厂的主流选择。托盒、盖膜、气体、吸水垫、封盒机五个要素要一起匹配。";
    next = scale==="大批量连续生产" ? "你的量适合看全自动气调封盒机，并把气体置换稳定性作为重点验证项。" :
           scale==="试产 / 小批量" ? "建议先用半自动气调封盒机把产品和渠道跑通，验证货架期后再放量。" :
           "先按产品克重定盒型，再成套验证托盒、盖膜和封口参数。";
  }
  if(prob==="渗液 / 血水多") next += " 你的产品汁液偏多，方案里记得把吸水垫的吸液量算足，或评估贴体包装。";
  if(prob==="漏气 / 胀包") next += " 你已经遇到漏气/胀包，建议先按案例库的排查顺序定位原因，再决定要不要换方案。";
  if(prob==="成本下不来") next += " 成本要连损耗一起算：漏气报废往往比材料差价贵得多。";
  return {proc:proc, reason:reason, next:next};
}

}

  var a=APPS[k];
  var compare = a.compare.map(function(r){return '<tr><th>'+r[0]+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join("");
  var relCases = CASES.filter(function(c){return c.products.indexOf(a.name)>=0;}).slice(0,3).map(caseCard).join("");
  return pageHead([{name:"包装设备方案",route:"#/solutions"},{name:"应用"},{name:a.name}], a.name+"包装",
    "这类产品的包装关注点："+a.focus.join("；")+"。", WX_BTNS)+
  '<section class="section"><div class="wrap"><div class="sec-head"><h2>'+a.name+'包装常见的痛点</h2></div><div class="grid grid-2">'+
    a.pains.map(function(x){return '<div class="card"><p style="color:var(--ink);font-size:15.5px">'+x+'</p></div>';}).join("")+'</div></div></section>'+
  '<section class="section soft"><div class="wrap"><div class="sec-head"><h2>推荐工艺对比</h2></div><div class="table-scroll"><table class="compare"><thead><tr><th>工艺</th><th>适合什么场景</th><th>说明</th></tr></thead><tbody>'+compare+'</tbody></table></div></div></section>'+
  '<section class="section"><div class="wrap"><div class="sec-head"><h2>推荐方案组合</h2><p>这里只确认组合关系：工艺与设备看「包装设备方案」，材料单品看「包装材料」。</p></div>'+comboStrip(a.combo, "#/solutions", "推荐组合", "去包装设备方案 →")+'</div></section>'+
  (relCases?relatedBlock(a.name+"相关的问题解析", relCases):"")+
  ctaBand("你的"+a.name+"包装卡在哪一步？");
}

/* ================= 案例库 ================= */
var caseFilter = {problem:"全部", process:"全部", product:"全部", q:""};
function filterBtn(group, val){
  var on = caseFilter[group]===val;
  return '<button class="fbtn'+(on?' on':'')+'" data-filter-group="'+group+'" data-filter-val="'+esc(val)+'">'+esc(val)+'</button>';
}
function pageCases(){
  var problemOpts=["全部","漏气","胀包","起雾","褪色/变色","渗液/血水","封口不良","破袋/破盒","成本高","其他"];
  var processOpts=["全部","气调包装","贴体包装","拉伸膜包装","真空包装"];
  var productOpts=["全部"].concat(PRODUCT_CATS);
  var filtered = CASES.filter(function(c){
    if(caseFilter.problem!=="全部" && c.problems.indexOf(caseFilter.problem)<0) return false;
    if(caseFilter.process!=="全部" && c.processes.indexOf(caseFilter.process)<0) return false;
    if(caseFilter.product!=="全部" && c.products.indexOf(caseFilter.product)<0) return false;
    if(caseFilter.q && (c.title+c.summary+c.problems.join("")).indexOf(caseFilter.q)<0) return false;
    return true;
  });
  var cards = filtered.length ? '<div class="grid grid-3">'+filtered.map(caseCard).join("")+'</div>' :
    '<div class="empty-state"><h3 style="margin-bottom:8px">没有找到匹配的解析</h3><p>换个筛选条件试试，或者把你的问题直接提交给我们，帮你单独分析。</p><p class="mt"><a class="btn btn-teal btn-sm" href="#/submit">提交我的问题</a></p></div>';
  return pageHead([{name:"包装问题案例"}],"包装问题案例","真实问题，原因分析，解决方案，持续更新。当前上线的均为「问题解析」：通用排查逻辑，不涉及具体客户信息。", '<a class="btn btn-teal" href="#/submit">没找到你的问题？提交给我们</a>')+
  '<section class="section"><div class="wrap"><div class="filter-bar">'+
    '<div class="filter-row"><span class="f-label">问题类型</span>'+problemOpts.map(function(v){return filterBtn("problem",v);}).join("")+'</div>'+
    '<div class="filter-row"><span class="f-label">包装工艺</span>'+processOpts.map(function(v){return filterBtn("process",v);}).join("")+'</div>'+
    '<div class="filter-row"><span class="f-label">产品类别</span>'+productOpts.map(function(v){return filterBtn("product",v);}).join("")+'</div>'+
    '<div class="search-row"><input type="search" id="caseSearch" placeholder="搜索问题，如：漏气、起雾、封口" value="'+esc(caseFilter.q)+'"/><button class="btn btn-ghost btn-sm" id="caseReset">重置筛选</button></div>'+
  '</div><p class="note" style="margin:0 0 16px">共 '+filtered.length+' 篇（问题解析 '+CASES.length+' 篇持续更新中；「解决案例」类内容将在取得客户授权或脱敏后上线）</p>'+cards+'</div></section>'+ctaBand();
}
function pageCaseDetail(slug){
  var idx=-1, c=null;
  CASES.forEach(function(x,i){ if(x.slug===slug){idx=i;c=x;} });
  if(!c) return page404();
  var dims=["材料","设备","工艺","操作"];
  var causes = dims.map(function(d){
    return '<div class="cause-box"><h3>'+d+'方面</h3><ul>'+c.causes[d].map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></div>';
  }).join("");
  var eqHtml = (c.relatedEq||[]).map(eqCard).join("");
  var matHtml = (c.relatedMat||[]).map(matCard).join("");
  var related = CASES.filter(function(x){return x.slug!==slug && x.problems.some(function(p){return c.problems.indexOf(p)>=0;});}).slice(0,3);
  if(related.length<1) related = CASES.filter(function(x){return x.slug!==slug;}).slice(0,3);
  var prev = idx>0 ? CASES[idx-1] : null, next = idx<CASES.length-1 ? CASES[idx+1] : null;
  return pageHead([{name:"包装问题案例",route:"#/cases"},{name:c.title}], c.title, c.summary)+
  '<section class="section"><div class="wrap"><div class="article-body">'+
    '<div class="meta-row"><span class="chip warn">'+c.type+'</span>'+c.problems.map(function(p){return '<span class="chip teal">'+p+'</span>';}).join("")+c.processes.map(function(p){return '<span class="chip">'+p+'</span>';}).join("")+c.products.map(function(p){return '<span class="chip">'+p+'</span>';}).join("")+'<span class="date">'+c.date+'</span></div>'+
    '<h2>一、问题现象</h2><p>'+c.phenomenon+'</p>'+phImg("问题现象示意","问题实拍图待 FIXPAC 提供后替换")+
    '<h2>二、可能原因（四个维度）</h2><div class="cause-grid">'+causes+'</div>'+
    '<h2>三、排查方法</h2><ul>'+c.checks.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>'+
    '<h2>四、解决方案</h2><ul>'+c.solutions.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>'+
    '<p class="note">说明：本文为「问题解析」，讲通用排查逻辑，不对应某个具体客户项目；实际处理以现场验证结果为准。</p>'+
  '</div></div></section>'+
  ((eqHtml||matHtml)?relatedBlock("本文涉及的设备和材料", eqHtml+matHtml):"")+
  relatedBlock("相关问题推荐", related.map(caseCard).join(""))+
  '<section class="section" style="padding-top:0"><div class="wrap"><div class="prev-next">'+(prev?'<a href="#/cases/'+prev.slug+'">← 上一篇：'+prev.title+'</a>':'<a class="disabled">← 没有上一篇</a>')+(next?'<a href="#/cases/'+next.slug+'">下一篇：'+next.title+' →</a>':'<a class="disabled">没有下一篇 →</a>')+'</div></div></section>'+
  ctaBand("我也遇到这个问题");
}

function pageGuideDetail(slug){
  var idx=-1, g=null;
  GUIDES.forEach(function(x,i){ if(x.slug===slug){idx=i;g=x;} });
  if(!g) return page404();
  var body = g.body.map(function(b){
    var h = b.h?'<h2>'+b.h+'</h2>':"";
    if(b.p) h += b.p.map(function(p){return '<p>'+p+'</p>';}).join("");
    if(b.list) h += '<ul>'+b.list.map(function(li){return '<li>'+li+'</li>';}).join("")+'</ul>';
    return h;
  }).join("");
  var eqHtml=(g.relatedEq||[]).map(eqCard).join(""), matHtml=(g.relatedMat||[]).map(matCard).join("");
  var prev = idx>0?GUIDES[idx-1]:null, next=idx<GUIDES.length-1?GUIDES[idx+1]:null;
  return pageHead([{name:"选型指南",route:"#/guide"},{name:"第 "+g.ep+" 期"}], g.title, g.summary)+
  '<section class="section"><div class="wrap"><div class="article-body">'+
    '<div class="meta-row"><span class="chip teal">《气调包装选型》第 '+g.ep+' 期 / 共 8 期</span><span class="chip">气调包装</span><span class="date">'+g.date+'</span></div>'+
    '<div class="mt">'+phImg("本期视频（视频号）","视频内容待 FIXPAC 提供后嵌入","video")+'</div>'+
    '<div class="mt">'+body+'</div>'+
  '</div>'+
  '<div class="prev-next">'+(prev?'<a href="#/guide/'+prev.slug+'">← 上一期：'+prev.title+'</a>':'<a class="disabled">← 已是第一期</a>')+(next?'<a href="#/guide/'+next.slug+'">下一期：'+next.title+' →</a>':'<a class="disabled">已是最后一期 →</a>')+'</div>'+
  '</div></section>'+
  ((eqHtml||matHtml)?relatedBlock("本期相关设备 / 材料", eqHtml+matHtml):"")+
  ctaBand("选型拿不准？把产品情况发我们");
}

var LAST_ROUTE = "首页";
function routeName(path){
  var map = {"/":"首页","/solutions":"包装设备方案","/solutions/map":"气调包装","/solutions/vsp":"贴体包装","/solutions/thermoforming":"拉伸膜包装","/solutions/vacuum":"真空包装","/materials":"包装材料","/products":"包装设备方案","/equipment":"包装设备方案","/cases":"包装问题案例","/guide":"选型指南","/about":"关于 FIXPAC","/contact":"联系我们","/submit":"提交问题页"};
  if(map[path]) return map[path];
  if(path.indexOf("/products/")===0) return "产品详情";
  if(path.indexOf("/equipment/")===0) return "设备详情";
  if(path.indexOf("/materials/")===0) return "材料详情";
  if(path.indexOf("/applications/")===0) return "应用页";
  if(path.indexOf("/cases/")===0) return "案例详情";
  if(path.indexOf("/guide/")===0) return "选型文章";
  return "站内页面";
}
function parseHash(){
  var h = location.hash.replace(/^#/, "") || "/";
  var q = {};
  var qi = h.indexOf("?");
  if(qi>=0){ new URLSearchParams(h.slice(qi+1)).forEach(function(v,k){ q[k]=v; }); h = h.slice(0,qi); }
  if(h.length>1 && h.endsWith("/")) h = h.slice(0,-1);
  return {path:h, q:q};
}
function render(){
  var r = parseHash(), path = r.path, app = document.getElementById("app");
  var html;
  if(path==="/" ) html = pageHome();
  else if(path==="/solutions") html = pageSolutions();
  else if(path==="/solutions/map") html = pageMap();
  else if(path==="/solutions/map/equipment"){ html = pageEquipmentSolutions(); }
  else if(path==="/solutions/map/materials"){ materialFilter={process:"map"}; html = pageMaterials(); }
  else if(path==="/solutions/vsp") html = pageBasicProcess("vsp");
  else if(path==="/solutions/thermoforming") html = pageBasicProcess("thermo");
  else if(path==="/solutions/vacuum") html = pageBasicProcess("vacuum");
  else if(path==="/products"){
    if(r.q.type==="material"){ materialFilter={process:["all","map","vsp","thermo","vacuum"].indexOf(r.q.process)>=0 ? r.q.process : "all"}; html = pageMaterials(); }
    else html = pageEquipmentSolutions();
  }
  else if(path==="/equipment"){ html = pageEquipmentSolutions(); }
  else if(path==="/materials"){
    materialFilter={process:["all","map","vsp","thermo","vacuum"].indexOf(r.q.process)>=0 ? r.q.process : "all"};
    html = pageMaterials();
  }
  else if(path==="/products/map-semi-auto" || path==="/equipment/map-semi-auto") html = pageEquipDetail("semi");
  else if(path==="/products/map-auto" || path==="/equipment/map-auto") html = pageEquipDetail("auto");
  else if(path==="/products/map-tray" || path==="/materials/map-tray" || path==="/equipment/map-tray") html = pageMatDetail("tray");
  else if(path==="/products/map-lidding-film" || path==="/materials/map-lidding-film" || path==="/equipment/map-lidding-film") html = pageMatDetail("film");
  else if(path==="/products/absorbent-pad" || path==="/materials/absorbent-pad" || path==="/equipment/absorbent-pad") html = pageMatDetail("pad");
  else if(path==="/applications/pork") html = pageApp("pork");
  else if(path==="/applications/beef-lamb") html = pageApp("beef");
  else if(path==="/applications/poultry") html = pageApp("poultry");
  else if(path==="/applications/cooked-food") html = pageApp("cooked");
  else if(path==="/cases"){
    if(r.q.problem){ caseFilter.problem = r.q.problem; }
    if(r.q.process){ caseFilter.process = r.q.process; }
    if(r.q.product){ caseFilter.product = r.q.product; }
    html = pageCases();
  }
  else if(path.indexOf("/cases/")===0) html = pageCaseDetail(path.split("/")[2]);
  else if(path==="/guide") html = pageGuide();
  else if(path.indexOf("/guide/")===0) html = pageGuideDetail(path.split("/")[2]);
  else if(path==="/about") html = pageAbout();
  else if(path==="/contact") html = pageContact(r.q.need||"");
  else if(path==="/submit") html = pageSubmit({need:r.q.need||"", from: r.q.from || LAST_ROUTE});
  else if(path==="/privacy") html = pagePrivacy();
  else html = page404();
  app.innerHTML = html;
  LAST_ROUTE = routeName(path);
  document.getElementById("mobileMenu").classList.remove("open");
  document.getElementById("burger").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
  var steps = app.querySelectorAll(".steps .step .num");
  steps.forEach(function(n,i){ n.textContent = i+1; });
  app.querySelectorAll(".check-pill input:checked").forEach(function(inp){
    var l = inp.closest(".check-pill"); if(l) l.classList.add("on");
  });
}

function openWx(){ document.getElementById("wxModal").classList.add("open"); }
function closeWx(){ document.getElementById("wxModal").classList.remove("open"); }
function copyWx(){
  var done = function(){ toast("已复制微信号 FIXPAC，打开微信添加"); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText("FIXPAC").then(done).catch(function(){ fallbackCopy(done); });
  } else fallbackCopy(done);
}
function fallbackCopy(done){
  var ta=document.createElement("textarea"); ta.value="FIXPAC"; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("微信号是 FIXPAC，请手动添加"); }
  document.body.removeChild(ta);

function handleForm(form){
  var err = form.querySelector(".form-error");
  var company = form.querySelector('[name=company]').value.trim();
  var contact = form.querySelector('[name=contact]').value.trim();
  var reach = form.querySelector('[name=reach]').value.trim();
  var msgs = [];
  if(!company) msgs.push("公司名称");
  if(!contact) msgs.push("联系人");
  if(!reach) msgs.push("手机或微信");
  var prods = [], procs = [], needVal = "";
  if(form.dataset.form==="full"){
    form.querySelectorAll('[name=products]:checked').forEach(function(el){ prods.push(el.value); });
    form.querySelectorAll('[name=procs]:checked').forEach(function(el){ procs.push(el.value); });
    var need = form.querySelector('[name=need]:checked');
    if(need) needVal = need.value;
    if(!prods.length) msgs.push("包装产品类型（至少选一个）");
    if(!need) msgs.push("需求类型");
  }
  if(msgs.length){
    err.textContent = "还差这几项没填：" + msgs.join("、");
    err.classList.add("show");
    err.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  err.classList.remove("show");
  var sourceVal = form.dataset.source || "";
  var sourceShow = form.querySelector('[name=sourceShow]');
  if(sourceShow && sourceShow.value.trim()) sourceVal = sourceShow.value.trim();
  var descEl = form.querySelector('[name=desc]');
  var descVal = descEl ? descEl.value.trim() : "";
  var honeyEl = form.querySelector('[name=_honey]');
  var payload = {};
  payload["公司名称"] = company;
  payload["联系人"] = contact;
  payload["手机或微信"] = reach;
  payload["来源页面"] = sourceVal;
  if(form.dataset.form==="full"){
    payload["产品类型"] = prods.join("、");
    if(procs.length) payload["包装工艺"] = procs.join("、");
    payload["需求类型"] = needVal;
    payload["问题描述"] = descVal;
  } else {
    payload["遇到的问题"] = descVal;
  }
  payload["_subject"] = "FIXPAC 网站新线索";
  payload["_template"] = "table";
  payload["_honey"] = honeyEl ? honeyEl.value : "";
  payload["_captcha"] = "false";
  var btn = form.querySelector('button[type="submit"]');
  var btnText = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "提交中…"; }
  fetch("https://formsubmit.co/ajax/825024525@qq.com", {
    method: "POST",
    headers: {"Content-Type": "application/json", "Accept": "application/json"},
    body: JSON.stringify(payload)
  }).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(data){
      var ok = res.ok && (data.success === "true" || data.success === true);
      if(!ok) throw new Error("submit failed");
      form.innerHTML = formSuccessHTML();
      form.scrollIntoView({behavior:"smooth", block:"center"});
    });
  }).catch(function(){
    if(btn){ btn.disabled = false; btn.textContent = btnText; }
    err.textContent = "提交失败，请检查网络后重试，或直接加微信 FIXPAC 联系我们";
    err.classList.add("show");
    err.scrollIntoView({behavior:"smooth", block:"center"});
  });
}
document.addEventListener("click", function(ev){
  var t;
  if((t = ev.target.closest("[data-wx]"))){ ev.preventDefault(); openWx(); return; }
  if((t = ev.target.closest("[data-copy-wx]"))){ ev.preventDefault(); copyWx(); return; }
  if((t = ev.target.closest("[data-close-modal]"))){ closeWx(); return; }
  if(ev.target.id==="wxModal"){ closeWx(); return; }
  if((t = ev.target.closest("[data-quiz-opt]"))){
    var q = QUIZ[quizState.step];
    quizState[q.key] = t.dataset.quizOpt;
    quizState.step++;
    document.getElementById("quizBox").innerHTML = quizHTML();
    return;
  }
  if((t = ev.target.closest("[data-quiz-back]"))){
    quizState.step = Math.max(0, quizState.step-1);
    document.getElementById("quizBox").innerHTML = quizHTML();
    return;
  }
  if((t = ev.target.closest("[data-quiz-restart]"))){
    quizState = {step:0, product:"", problem:"", scale:""};
    document.getElementById("quizBox").innerHTML = quizHTML();
    return;
  }
  if((t = ev.target.closest("[data-material-process]"))){
    materialFilter.process = t.dataset.materialProcess;
    document.getElementById("app").innerHTML = pageMaterials();
    window.scrollTo(0,0);
    return;
  }
  if((t = ev.target.closest("[data-product-group]"))){
    document.getElementById("app").innerHTML = pageEquipmentSolutions();
    window.scrollTo(0,0);
    return;
  }
  if((t = ev.target.closest("[data-filter-group]"))){
    caseFilter[t.dataset.filterGroup] = t.dataset.filterVal;
    document.getElementById("app").innerHTML = pageCases();
    window.scrollTo(0,0);
    return;
  }
  if(ev.target.id==="caseReset"){
    caseFilter = {problem:"全部", process:"全部", product:"全部", q:""};
    history.replaceState(null,"","#/cases");
    document.getElementById("app").innerHTML = pageCases();
    return;
  }
  if((t = ev.target.closest(".nav-item > .nav-link"))){
    var item = t.parentElement;
    var wasOpen = item.classList.contains("open");
    document.querySelectorAll(".nav-item.open").forEach(function(n){ n.classList.remove("open"); });
    if(item.querySelector(".dropdown") && !wasOpen && window.innerWidth>860){ /* 桌面第一次点开下拉，不跳转 */ 
      if(ev.target.closest("a") && t.getAttribute("href")){ /* allow nav on second click */ }
    }
    return;
  }
});
document.addEventListener("mouseover", function(ev){
  var item = ev.target.closest(".nav-item");
  document.querySelectorAll(".nav-item.open").forEach(function(n){ if(n!==item) n.classList.remove("open"); });
  if(item && item.querySelector(".dropdown")) item.classList.add("open");
});
document.addEventListener("change", function(ev){
  if(ev.target.matches && ev.target.matches(".check-pill input")){
    var lab = ev.target.closest(".check-pill");
    if(ev.target.type==="radio"){
      document.querySelectorAll('input[name="'+ev.target.name+'"]').forEach(function(r){
        var l=r.closest(".check-pill"); if(l) l.classList.toggle("on", r.checked);
      });
    } else if(lab){ lab.classList.toggle("on", ev.target.checked); }
  }
});
document.addEventListener("input", function(ev){
  if(ev.target.id==="caseSearch"){
    caseFilter.q = ev.target.value;
    var pos = ev.target.selectionStart;
    var wrap = document.querySelector(".filter-bar");
    var parent = document.getElementById("app");
    /* 只刷新结果区：重渲染整页会丢焦点，改为局部刷新列表容器 */
    renderCaseResults();
    var inp = document.getElementById("caseSearch");
    if(inp){ inp.focus(); inp.setSelectionRange(pos,pos); }
  }
});
function renderCaseResults(){
  /* 轻量做法：整页重渲染案例页内容区（筛选状态保留在 caseFilter 中） */
  var app = document.getElementById("app");
  var scrollY = window.scrollY;
  app.innerHTML = pageCases();
  window.scrollTo(0, scrollY);
}
document.addEventListener("submit", function(ev){
  var form = ev.target.closest("form[data-form]");
  if(form){ ev.preventDefault(); handleForm(form); }
});
document.getElementById("burger").addEventListener("click", function(){
  var m = document.getElementById("mobileMenu");
  var open = m.classList.toggle("open");
  this.setAttribute("aria-expanded", open ? "true" : "false");
});
document.getElementById("mobileMenu").addEventListener("click", function(ev){
  if(ev.target.closest("a")) this.classList.remove("open");
});
document.getElementById("wxCollapse").addEventListener("click", function(){
  document.getElementById("wxFloat").style.display="none";
  document.getElementById("wxFloatMini").style.display="block";
});
if(window.innerWidth < 1560){
  document.getElementById("wxFloat").style.display="none";
  document.getElementById("wxFloatMini").style.display="block";
}
document.getElementById("wxFloatMini").addEventListener("click", function(){
  document.getElementById("wxFloat").style.display="block";
  this.style.display="none";
});
window.addEventListener("hashchange", render);
buildNav();
buildFooter();
render();
</script>
